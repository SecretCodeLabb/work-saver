<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoSaver Win</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>

<body>
  <main class="container">
    <header>
      <img src="/src/assets/DCN.svg" alt="Don't Crash Now Logo" class="app-logo">
      <h1>Don't Crash Now!</h1>
      <p>No vuelvas a perder 4 horas de trabajo... otra vez.</p>
    </header>

    <div class="card toggle-section">
      <label class="switch-container">
        <input type="checkbox" id="toggle-switch">
        <span class="slider round"></span>
      </label>
      <span id="status-label" class="status-label off">Apagado</span>
    </div>

    <div class="card config-section">
      <div class="input-group">
        <label for="interval-input">Intervalo (minutos)</label>
        <input type="number" id="interval-input" min="1" value="1">
      </div>

      <div class="input-group">
        <label for="process-input">Agregar Software</label>
        <div class="process-input-row">
          <input type="text" id="process-input" placeholder="ej. blender.exe">
          <button id="add-process-btn">Añadir</button>
        </div>
      </div>

      <div class="processes-container">
        <p class="subtitle">Procesos monitoreados:</p>
        <div id="process-list" class="process-list">
        </div>
      </div>
    </div>

    <div class="card info-section">
      <p id="last-saved-info" class="info-text">Esperando al primer guardado...</p>
    </div>
  </main>

  <footer class="app-footer">
    <p>Desarrollado por DXNX.3D</p>
    <div class="social-links">
      <a href="https://github.com/SecretCodeLabb" target="_blank" rel="noopener noreferrer" class="footer-link"
        title="GitHub">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"
          stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
          </path>
        </svg>
      </a>
      <a href="https://www.instagram.com/dxnx.3d/" target="_blank" rel="noopener noreferrer" class="footer-link"
        title="Instagram">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>
      <a href="https://www.artstation.com/danimation21" target="_blank" rel="noopener noreferrer" class="footer-link"
        title="Portfolio (ArtStation)">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 22h20L12 2z"></path>
          <path d="M12 12l4 8H8l4-8z"></path>
        </svg>
      </a>
    </div>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
